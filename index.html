<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Committee Hearing Schedule</title>

<style>

body{
    margin:0;
    background:#eef2f7;
    font-family:"Segoe UI", Arial, sans-serif;
    color:#333;
}

.container{
    max-width:1100px;
    margin:30px auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    overflow:hidden;
}

.header{
    background:#1B5E20;
    color:white;
    text-align:center;
    padding:30px 20px;
}

.header h1{
    margin:0;
    font-size:30px;
    font-weight:700;
}

.header h2{
    margin-top:8px;
    font-size:18px;
    font-weight:400;
}

.update{
    text-align:center;
    padding:18px;
    font-size:14px;
    color:#666;
    background:#f8f9fa;
    border-bottom:1px solid #e5e5e5;
}

.page-title{
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:#777;
    letter-spacing:2px;
    text-transform:uppercase;
    margin:25px 0 10px;
}

.schedule{
    width:95%;
    display:block;
    margin:auto;
    border:1px solid #ddd;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:35px;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    margin-right:20px;
}    

.footer{
    background:#1B5E20;
    color:white;
    text-align:center;
    padding:15px;
    font-size:13px;
}

@media(max-width:768px){

.header h1{
    font-size:24px;
}

.header h2{
    font-size:16px;
}

.container{
    margin:10px;
}

img{
    width:98%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <img src="sp_logo.png" class="logo" alt="SP Logo">

    <div class="title">

        <h1>Sangguniang Panlungsod ng Panabo</h1>

        <h2>Office of the Secretary to the Sanggunian</h2>

    </div>

</div>

<div class="update">

Last Updated: August 12, 2026 • 8:00 AM

</div>

<div class="page-title">

Page 1 of 1

</div>

<img src="page1.jpg" class="schedule">

<div class="page-title">


<div class="footer">

© Office of the Secretary to the Sanggunian<br>
Sangguniang Panlungsod ng Panabo

</div>

</div>

</body>

</html>
